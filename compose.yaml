services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: luckgage
      POSTGRES_PASSWORD: luckgage_local
      POSTGRES_USER: luckgage
    ports:
      - "5433:5432"
    volumes:
      - luckgage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luckgage -d luckgage"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  luckgage-postgres-data:
